<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060b" />
      <stop offset="40%" stop-color="#080e1a" />
      <stop offset="75%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="45%" stop-color="#7028E4" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#FF0055" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFB800" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00D4AA" />
    </linearGradient>

    <linearGradient id="thrustPlume" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px #00F0FF); }
        50% { opacity: 1; filter: drop-shadow(0 0 16px #00F0FF); }
      }
      @keyframes traceLine {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes craftFloat {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(-0.6deg); }
      }
      @keyframes afterburnerPulse {
        0%, 100% { transform: scaleX(0.90); opacity: 0.75; }
        50% { transform: scaleX(1.18); opacity: 1; }
      }
      @keyframes glitchText {
        0%, 93%, 100% { transform: translate(0, 0); opacity: 1; }
        94% { transform: translate(-2px, 1px); opacity: 0.85; }
        96% { transform: translate(2px, -1px); opacity: 0.95; }
        98% { transform: translate(0, 0); opacity: 1; }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes tagPulse {
        0%, 100% { stroke-opacity: 0.8; }
        50% { stroke-opacity: 0.2; }
      }
      @keyframes eqBar1 { 0%, 100% { height: 6px; } 50% { height: 28px; } }
      @keyframes eqBar2 { 0%, 100% { height: 26px; } 50% { height: 10px; } }
      @keyframes eqBar3 { 0%, 100% { height: 14px; } 50% { height: 32px; } }
      @keyframes eqBar4 { 0%, 100% { height: 30px; } 50% { height: 8px; } }
      @keyframes eqBar5 { 0%, 100% { height: 18px; } 50% { height: 24px; } }

      .anim-trace {
        stroke-dasharray: 600;
        animation: traceLine 4s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
      }
      .anim-radar {
        transform-origin: 1040px 170px;
        animation: radarSpin 6s linear infinite;
      }
      .anim-craft {
        animation: craftFloat 4s ease-in-out infinite;
      }
      .anim-burner {
        transform-origin: 810px 170px;
        animation: afterburnerPulse 0.12s ease-in-out infinite alternate;
      }
      .anim-title {
        animation: glitchText 7s infinite;
      }
      .blink {
        animation: blinkCursor 0.9s infinite;
      }
      .eq-1 { animation: eqBar1 0.45s ease-in-out infinite; }
      .eq-2 { animation: eqBar2 0.38s ease-in-out infinite; }
      .eq-3 { animation: eqBar3 0.52s ease-in-out infinite; }
      .eq-4 { animation: eqBar4 0.41s ease-in-out infinite; }
      .eq-5 { animation: eqBar5 0.48s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGrad)" />

  <!-- Grid Blueprint Pattern -->
  <g stroke="#00F0FF" stroke-width="0.5" opacity="0.07">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="190" x2="1200" y2="190" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="290" x2="1200" y2="290" />

    <line x1="100" y1="0" x2="100" y2="340" />
    <line x1="250" y1="0" x2="250" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="550" y1="0" x2="550" y2="340" />
    <line x1="700" y1="0" x2="700" y2="340" />
    <line x1="850" y1="0" x2="850" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
    <line x1="1150" y1="0" x2="1150" y2="340" />
  </g>

  <!-- Scanning Line Effect -->
  <g opacity="0.18">
    <rect x="0" y="0" width="1200" height="3" fill="#00F0FF">
      <animate attributeName="y" values="-10;345" dur="3.8s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Outer Tech Border & Crop Markers -->
  <rect x="16" y="16" width="1168" height="308" fill="none" stroke="#1d263b" stroke-width="1.5" />
  
  <!-- Corner Tech Reticles -->
  <path d="M 16,36 L 16,16 L 36,16" fill="none" stroke="#00F0FF" stroke-width="3" />
  <path d="M 1184,36 L 1184,16 L 1164,16" fill="none" stroke="#00F0FF" stroke-width="3" />
  <path d="M 16,304 L 16,324 L 36,324" fill="none" stroke="#00F0FF" stroke-width="3" />
  <path d="M 1184,304 L 1184,324 L 1164,324" fill="none" stroke="#00F0FF" stroke-width="3" />

  <!-- Animated High-Speed Circuit Traces -->
  <path d="M 20,68 L 180,68 L 220,118 L 540,118 L 570,88 L 880,88 L 920,138 L 1180,138" 
        fill="none" stroke="#00F0FF" stroke-width="1.8" opacity="0.45" class="anim-trace" />
  <path d="M 20,272 L 250,272 L 290,232 L 660,232 L 690,262 L 1180,262" 
        fill="none" stroke="#FF0055" stroke-width="1.8" opacity="0.4" class="anim-trace" style="animation-delay: -2s;" />

  <!-- Radar Telemetry Widget (Right side) -->
  <g transform="translate(1040, 170)">
    <!-- Radar Rings -->
    <circle r="75" fill="none" stroke="#1d2c42" stroke-width="1" />
    <circle r="52" fill="none" stroke="#1d2c42" stroke-width="1" stroke-dasharray="3,3" />
    <circle r="26" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.5" />
    <circle r="3" fill="#00F0FF" />

    <!-- Crosshairs -->
    <line x1="-85" y1="0" x2="85" y2="0" stroke="#00F0FF" stroke-width="0.8" opacity="0.35" />
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#00F0FF" stroke-width="0.8" opacity="0.35" />

    <!-- Degree Ticks -->
    <circle r="80" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="2, 18.9" opacity="0.5" />

    <!-- Rotating Sweep Beam -->
    <path d="M 0,0 L 72,0 A 72,72 0 0,0 50,-50 Z" fill="url(#radarSweep)" class="anim-radar" />

    <!-- Blip targets -->
    <circle cx="28" cy="-18" r="2.5" fill="#FFB800" filter="url(#glow)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="-35" cy="22" r="2.5" fill="#FF0055" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="12" cy="42" r="2" fill="#00FF88" filter="url(#glow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
    </circle>
    
    <text x="-70" y="98" fill="#8C99A8" font-family="'Courier New', monospace" font-size="9" letter-spacing="1">RADAR // 120Hz LOCK</text>
  </g>

  <!-- Anti-Gravity Craft Silhouette (Center-Right) -->
  <g class="anim-craft" transform="translate(60, 0)">
    <!-- Mach 1 Ion Trail / Kinetic Wake Waves -->
    <ellipse cx="680" cy="170" rx="140" ry="14" fill="url(#thrustPlume)" opacity="0.5" />
    <ellipse cx="660" cy="170" rx="100" ry="9" fill="url(#thrustPlume)" opacity="0.75" />
    <ellipse cx="630" cy="170" rx="60" ry="5" fill="#ffffff" opacity="0.9" />

    <!-- Exhaust shock diamond rings -->
    <ellipse cx="720" cy="170" rx="8" ry="14" fill="none" stroke="#00F0FF" stroke-width="1.8" opacity="0.7" />
    <ellipse cx="750" cy="170" rx="12" ry="20" fill="none" stroke="#7028E4" stroke-width="1.5" opacity="0.5" />
    <ellipse cx="790" cy="170" rx="18" ry="28" fill="none" stroke="#00F0FF" stroke-width="1.2" opacity="0.3" class="anim-burner" />

    <!-- Futuristic Anti-Gravity Interceptor Chassis (Vector Silhouette) -->
    <!-- Main Hull Spine & Delta Wing -->
    <path d="M 910,170 
             L 865,152 
             L 810,146 
             L 775,124 
             L 790,138 
             L 750,144 
             L 745,158 
             L 730,162 
             L 730,178 
             L 745,182 
             L 750,196 
             L 790,202 
             L 775,216 
             L 810,194 
             L 865,188 Z" 
          fill="#0B1220" stroke="#00F0FF" stroke-width="2.2" filter="url(#glow)" />

    <!-- Cockpit Dielectric Canopy -->
    <polygon points="860,170 835,164 805,165 825,170 805,175 835,176" 
             fill="#00F0FF" opacity="0.85" filter="url(#intenseGlow)" />

    <!-- Wing Canard Accents & Airbrake Flaps -->
    <line x1="775" y1="124" x2="810" y2="146" stroke="#FF0055" stroke-width="2.5" />
    <line x1="775" y1="216" x2="810" y2="194" stroke="#FF0055" stroke-width="2.5" />
    <line x1="745" y1="158" x2="730" y2="162" stroke="#FFB800" stroke-width="3" />
    <line x1="745" y1="182" x2="730" y2="178" stroke="#FFB800" stroke-width="3" />

    <!-- Magnetic Repulsor Ventral Emitters (Glowing Orbs) -->
    <circle cx="845" cy="158" r="3.5" fill="#00F0FF" filter="url(#intenseGlow)" />
    <circle cx="845" cy="182" r="3.5" fill="#00F0FF" filter="url(#intenseGlow)" />
    <circle cx="780" cy="150" r="3" fill="#00F0FF" filter="url(#intenseGlow)" />
    <circle cx="780" cy="190" r="3" fill="#00F0FF" filter="url(#intenseGlow)" />

    <!-- Speed Lines Streaming off Nose -->
    <line x1="915" y1="170" x2="990" y2="170" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="10, 8" opacity="0.7">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="0.3s" repeatCount="indefinite" />
    </line>
    <line x1="865" y1="148" x2="940" y2="148" stroke="#00F0FF" stroke-width="1" stroke-dasharray="8, 12" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-40" dur="0.25s" repeatCount="indefinite" />
    </line>
    <line x1="865" y1="192" x2="940" y2="192" stroke="#00F0FF" stroke-width="1" stroke-dasharray="8, 12" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-40" dur="0.25s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Typography, Team Credentials & Brand Badges (Left side) -->
  <g transform="translate(54, 42)">
    
    <!-- Top Cyber Banner: Team & Leader Recognition -->
    <g transform="translate(0, 0)">
      <!-- Team Tag Pill -->
      <rect x="0" y="0" width="168" height="24" rx="4" fill="#0b1a2e" stroke="#00F0FF" stroke-width="1.2" />
      <circle cx="12" cy="12" r="4" fill="#00F0FF" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="16" fill="#00F0FF" font-family="'Courier New', monospace" font-size="10.5" font-weight="bold" letter-spacing="1">
        TEAM: rajranjeet7680
      </text>

      <!-- Leader Tag Pill -->
      <rect x="176" y="0" width="186" height="24" rx="4" fill="#1f1606" stroke="#FFB800" stroke-width="1.2" />
      <polygon points="186,8 194,12 186,16" fill="#FFB800" />
      <text x="200" y="16" fill="#FFB800" font-family="'Courier New', monospace" font-size="10.5" font-weight="bold" letter-spacing="1">
        LEAD: RANJEET KUMAR
      </text>

      <!-- Tests Passing Pill -->
      <rect x="370" y="0" width="158" height="24" rx="4" fill="#061f12" stroke="#00FF88" stroke-width="1.2" />
      <text x="382" y="16" fill="#00FF88" font-family="'Courier New', monospace" font-size="10.5" font-weight="bold" letter-spacing="1">
        ✓ 235 TESTS PASSING
      </text>

      <!-- Specification Release -->
      <text x="540" y="16" fill="#8C99A8" font-family="'Courier New', monospace" font-size="10" letter-spacing="2">
        SPEC // v2.4.0 • 120Hz
      </text>
    </g>

    <!-- Main Title -->
    <g class="anim-title" transform="translate(0, 24)" font-family="'Arial Black', 'Helvetica Neue', Impact, sans-serif" font-weight="900">
      <text x="0" y="66" font-size="60" fill="url(#cyanGlow)" letter-spacing="3" filter="url(#glow)">
        WIPEOUT
      </text>
      <text x="340" y="66" font-size="60" fill="#EAEFF5" letter-spacing="5">
        //
      </text>
      <text x="410" y="66" font-size="60" fill="#EAEFF5" letter-spacing="4">
        APHELION
      </text>
    </g>

    <!-- Subtitle Bar -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="600" height="24" rx="2" fill="#00F0FF" opacity="0.12" />
      <rect x="0" y="0" width="4" height="24" rx="1" fill="#00F0FF" />
      <text x="14" y="16" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#00F0FF" letter-spacing="1.8">
        F-8000 ORBITAL MOTORSPORT // 1,650 KM/H 6-DOF HYPER-DRIVE
      </text>
    </g>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 138)" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold">
      <!-- Tag 1: Physics Engine -->
      <rect x="0" y="0" width="138" height="22" rx="3" fill="#101826" stroke="#00F0FF" stroke-width="1" />
      <text x="8" y="15" fill="#00F0FF">120Hz SPLINE ENGINE</text>

      <!-- Tag 2: 4 Sectors -->
      <rect x="146" y="0" width="136" height="22" rx="3" fill="#101826" stroke="#7028E4" stroke-width="1" />
      <text x="154" y="15" fill="#C490FF">4 MASTER SECTORS</text>

      <!-- Tag 3: 9 Fleet Cars -->
      <rect x="290" y="0" width="132" height="22" rx="3" fill="#101826" stroke="#FF0055" stroke-width="1" />
      <text x="298" y="15" fill="#FF4E88">9 FLEET VEHICLES</text>

      <!-- Tag 4: Career & Live Ops -->
      <rect x="430" y="0" width="170" height="22" rx="3" fill="#101826" stroke="#FFB800" stroke-width="1" />
      <text x="438" y="15" fill="#FFB800">CAREER + LIVE OPS HUB</text>
    </g>

    <!-- Circuit & Telemetry Status Footer -->
    <g transform="translate(0, 178)" font-family="'Courier New', monospace" font-size="10.5" fill="#8C99A8">
      <text x="0" y="14" letter-spacing="1">
        TRACKS: <tspan fill="#00F0FF" font-weight="bold">NEO-SHINJUKU</tspan> | <tspan fill="#00FF88">COASTLINE</tspan> | <tspan fill="#FFB800">FUJI SKYWAY</tspan> | <tspan fill="#FF0055">UNDERCITY</tspan>
      </text>
      <text x="0" y="32" letter-spacing="1">
        EDGE RELAY: <tspan fill="#00FF88">VERCEL PRODUCTION</tspan> | STATUS: <tspan fill="#00F0FF">OPTIMAL (100% 235/235)</tspan>
        <tspan fill="#00F0FF" class="blink">█</tspan>
      </text>
    </g>

    <!-- Equalizer Audio Waveform Visualizer -->
    <g transform="translate(525, 204)">
      <rect x="0" y="0" width="5" height="12" fill="#00F0FF" class="eq-1" />
      <rect x="8" y="0" width="5" height="22" fill="#00F0FF" class="eq-2" />
      <rect x="16" y="0" width="5" height="15" fill="#7028E4" class="eq-3" />
      <rect x="24" y="0" width="5" height="28" fill="#FF0055" class="eq-4" />
      <rect x="32" y="0" width="5" height="18" fill="#FFB800" class="eq-5" />
      <rect x="40" y="0" width="5" height="10" fill="#00FF88" class="eq-2" />
      <rect x="48" y="0" width="5" height="24" fill="#00F0FF" class="eq-4" />
      <text x="58" y="16" font-family="'Courier New', monospace" font-size="9" fill="#00F0FF" opacity="0.85">150 BPM</text>
    </g>
  </g>
</svg>
